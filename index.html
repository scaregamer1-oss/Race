<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RaceBox - Trigger C</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body { margin:0; background:#0b0f14; color:#e8eef6; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    .topbar { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .tabs { display:flex; gap:10px; }
    .tab { padding:10px 12px; border-radius: 999px; background:#0f1620; border:1px solid #24344c; cursor:pointer; user-select:none; }
    .tab.active { background:#2b8cff; color:#001425; border-color:#2b8cff; font-weight:900; }
    .card { background:#121a24; border:1px solid #213044; border-radius: 14px; padding: 14px; margin: 12px 0; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    button {
      border:0; border-radius: 12px; padding: 12px 14px; font-weight: 900;
      background:#2b8cff; color:#001425; cursor:pointer;
    }
    button.secondary { background:#1f2c3e; color:#e8eef6; border:1px solid #2b3c54; }
    button.danger { background:#ff4d4d; color:#220000; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .kpi { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    .kpi .box { background:#0f1620; border:1px solid #1f2b3b; border-radius: 12px; padding: 12px; }
    .label { opacity:.75; font-size: 12px; }
    .value { font-size: 22px; font-weight: 1000; margin-top: 4px; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #223247; text-align:left; }
    th { font-size: 12px; opacity:.85; }
    .small { font-size: 12px; opacity:.85; line-height: 1.45; }
    .pill { display:inline-block; padding: 4px 10px; border-radius:999px; background:#0f1620; border:1px solid #24344c; font-size:12px; }
    .warn { color:#ffb020; font-weight:900; }
    .bad { color:#ff4d4d; font-weight:1000; }
    .ok { color:#6bff95; font-weight:1000; }
    .hide { display:none !important; }
    .historyItem { background:#0f1620; border:1px solid #223247; border-radius: 12px; padding: 12px; margin: 10px 0; }
    .historyTop { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; }
    .mono { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="tabs">
        <div id="tabRun" class="tab active">Run</div>
        <div id="tabHistory" class="tab">History</div>
      </div>
      <span id="status" class="pill">idle</span>
    </div>

    <!-- VIEW RUN -->
    <div id="viewRun">
      <div class="card">
        <div class="row">
          <button id="btnArm">ARM</button>
          <button id="btnStop" class="danger" disabled>STOP</button>
          <button id="btnReset" class="secondary">RESET</button>
        </div>

        <div class="kpi" style="margin-top:12px;">
          <div class="box">
            <div class="label">Kecepatan (km/j)</div>
            <div id="speed" class="value mono">—</div>
          </div>
          <div class="box">
            <div class="label">Jarak run (m)</div>
            <div id="distance" class="value mono">0.0</div>
          </div>
          <div class="box">
            <div class="label">Akurasi GPS (m)</div>
            <div id="accuracy" class="value mono">—</div>
          </div>
        </div>

        <div class="small" style="margin-top:10px;">
          State: <span id="stateText" class="pill">idle</span>
          <span id="hint" class="small" style="margin-left:8px;"></span>
        </div>
      </div>

      <div class="card">
        <h1>Hasil (split)</h1>
        <table>
          <thead>
            <tr><th>Marker</th><th>Jarak</th><th>Waktu</th><th>MAX speed (km/j)</th></tr>
          </thead>
          <tbody>
            <tr><td>60 ft</td><td>18.288 m</td><td id="t60">—</td><td id="n60">—</td></tr>
            <tr><td>201 m</td><td>201 m</td><td id="t201">—</td><td id="n201">—</td></tr>
            <tr><td>402 m </td><td>402 m</td><td id="t402">—</td><td id="n402">—</td></tr>
            <tr><td>500 m</td><td>500 m</td><td id="t500">—</td><td id="n500">—</td></tr>
            <tr>
              <td><b>MAX SPEED</b></td>
              <td id="maxAt"><b>—</b></td>
              <td>—</td>
              <td id="maxSpeed"><b>—</b></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- VIEW HISTORY -->
    <div id="viewHistory" class="hide">
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <h1 style="margin:0;">History</h1>
          <div class="row">
            <button id="btnClearAll" class="danger">Hapus Semua</button>
          </div>
        </div>
      </div>
      <div id="historyList"></div>
      <div id="historyEmpty" class="card small">Belum ada data tersimpan.</div>
    </div>
  </div>

<script>
(() => {
  // SETTINGS
  const V_START_KMH = 3;  // Turunkan sedikit agar lebih sensitif
  const D_MIN_METERS = 2; 
  const MAX_ACC_METERS = 15;
  const HISTORY_KEY = "racebox_v2_storage";

  const TARGETS = [
    { key: "60", meters: 18.288 },
    { key: "201", meters: 201 },
    { key: "402", meters: 402 },
    { key: "500", meters: 500 }
  ];

  // UI ELEMENTS
  const el = (id) => document.getElementById(id);
  const btns = { arm: el("btnArm"), stop: el("btnStop"), reset: el("btnReset") };
  const views = { run: el("viewRun"), history: el("viewHistory") };
  const tabs = { run: el("tabRun"), history: el("tabHistory") };

  // APP STATE
  let state = "idle";
  let watchId = null;
  let armFix = null;
  let prevFix = null;
  let totalDist = 0;
  let startPerf = null;
  let hit = new Map();
  let maxSpeedKmh = 0;
  let maxSpeedAtM = 0;

  // HELPERS
  function setUIState(s) {
    state = s;
    el("stateText").textContent = s;
    el("status").textContent = s;
    btns.arm.disabled = !["idle", "finished", "stopped"].includes(s);
    btns.stop.disabled = (s === "idle");
  }

  function setHint(msg, cls="") {
    const h = el("hint");
    h.textContent = msg;
    h.className = "small " + cls;
  }

  function fmtTime(ms) { return (ms/1000).toFixed(3) + " s"; }

  // LOGIC
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = (d) => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function resetDisplay() {
    el("speed").textContent = "—";
    el("distance").textContent = "0.0";
    el("accuracy").textContent = "—";
    el("maxSpeed").textContent = "—";
    el("maxAt").textContent = "—";
    TARGETS.forEach(t => {
      el("t"+t.key).textContent = "—";
      el("n"+t.key).textContent = "—";
    });
  }

  function onPosition(pos) {
    const { latitude, longitude, accuracy, speed } = pos.coords;
    const spKmh = (speed || 0) * 3.6;
    const perfNow = performance.now();

    el("accuracy").textContent = accuracy.toFixed(1);
    el("speed").textContent = spKmh.toFixed(1);

    if (accuracy > MAX_ACC_METERS) return;

    const fix = { lat: latitude, lon: longitude, perfNow };

    // 1. MENGUNCI TITIK START (ARMED)
    if (state === "armed" && !armFix) {
      armFix = fix;
      prevFix = fix;
      setHint("READY! Gas sekarang untuk mulai.", "ok");
      return;
    }

    // 2. DETEKSI PERGERAKAN (AUTO START / TRIGGER C)
    if (state === "armed" && armFix) {
      const dFromArm = haversine(armFix.lat, armFix.lon, fix.lat, fix.lon);
      
      if (spKmh >= V_START_KMH || dFromArm >= D_MIN_METERS) {
        state = "running";
        setUIState("running");
        startPerf = perfNow;
        totalDist = 0;
        hit.clear();
        setHint("RUNNING...", "ok");
      }
      prevFix = fix;
      return;
    }

    // 3. SEDANG JALAN (RUNNING)
    if (state === "running") {
      const d = haversine(prevFix.lat, prevFix.lon, fix.lat, fix.lon);
      totalDist += d;
      el("distance").textContent = totalDist.toFixed(1);

      if (spKmh > maxSpeedKmh) {
        maxSpeedKmh = spKmh;
        maxSpeedAtM = totalDist;
        el("maxSpeed").textContent = maxSpeedKmh.toFixed(1);
        el("maxAt").textContent = maxSpeedAtM.toFixed(1) + " m";
      }

      TARGETS.forEach(t => {
        if (!hit.has(t.key) && totalDist >= t.meters) {
          const timeMs = perfNow - startPerf;
          hit.set(t.key, timeMs);
          el("t"+t.key).textContent = fmtTime(timeMs);
          el("n"+t.key).textContent = spKmh.toFixed(1);
        }
      });

      if (totalDist >= 500) finishRun(true);
      prevFix = fix;
    }
  }

  function finishRun(success) {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    setUIState(success ? "finished" : "stopped");
    setHint(success ? "Selesai! Data disimpan." : "Berhenti.", success ? "ok" : "warn");

    if (success && hit.size > 0) {
      const runData = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        maxV: maxSpeedKmh.toFixed(1),
        maxD: totalDist.toFixed(1),
        splits: Object.fromEntries(hit)
      };
      const logs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      logs.unshift(runData);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(logs.slice(0, 50)));
    }
  }

  // BUTTON ACTIONS
  btns.arm.onclick = () => {
    if (!navigator.geolocation) return alert("GPS tidak didukung!");
    resetDisplay();
    maxSpeedKmh = 0;
    armFix = null;
    setUIState("armed");
    setHint("Mencari GPS fix...", "warn");
    watchId = navigator.geolocation.watchPosition(onPosition, (err) => {
      setHint("GPS Error: " + err.message, "bad");
    }, { enableHighAccuracy: true });
  };

  btns.stop.onclick = () => finishRun(false);
  
  btns.reset.onclick = () => {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    resetDisplay();
    setUIState("idle");
    setHint("Ready.");
  };

  // TABS
  tabs.run.onclick = () => {
    views.run.classList.remove("hide");
    views.history.classList.add("hide");
    tabs.run.classList.add("active");
    tabs.history.classList.remove("active");
  };

  tabs.history.onclick = () => {
    views.run.classList.add("hide");
    views.history.classList.remove("hide");
    tabs.history.classList.add("active");
    tabs.run.classList.remove("active");
    renderHistory();
  };

  function renderHistory() {
    const logs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    const list = el("historyList");
    el("historyEmpty").classList.toggle("hide", logs.length > 0);
    list.innerHTML = "";
    logs.forEach(log => {
      const div = document.createElement("div");
      div.className = "historyItem";
      div.innerHTML = `
        <div class="historyTop">
          <div>
            <strong>${log.date}</strong><br>
            <small>Max: ${log.maxV} km/j @ ${log.maxD}m</small>
          </div>
        </div>
      `;
      list.appendChild(div);
    });
  }

  el("btnClearAll").onclick = () => {
    if(confirm("Hapus semua?")) {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    }
  };

})();
</script>
</body>
</html>
