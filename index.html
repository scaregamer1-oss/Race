<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RaceBox - Trigger 5km/h</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body { margin:0; background:#0b0f14; color:#e8eef6; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    .topbar { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .tabs { display:flex; gap:10px; }
    .tab { padding:10px 12px; border-radius: 999px; background:#0f1620; border:1px solid #24344c; cursor:pointer; user-select:none; }
    .tab.active { background:#2b8cff; color:#001425; border-color:#2b8cff; font-weight:900; }
    .card { background:#121a24; border:1px solid #213044; border-radius: 14px; padding: 14px; margin: 12px 0; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    button {
      border:0; border-radius: 12px; padding: 12px 14px; font-weight: 900;
      background:#2b8cff; color:#001425; cursor:pointer;
    }
    button.secondary { background:#1f2c3e; color:#e8eef6; border:1px solid #2b3c54; }
    button.danger { background:#ff4d4d; color:#220000; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .kpi { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    .kpi .box { background:#0f1620; border:1px solid #1f2b3b; border-radius: 12px; padding: 12px; }
    .label { opacity:.75; font-size: 12px; }
    .value { font-size: 22px; font-weight: 1000; margin-top: 4px; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #223247; text-align:left; }
    th { font-size: 12px; opacity:.85; }
    .pill { display:inline-block; padding: 4px 10px; border-radius:999px; background:#0f1620; border:1px solid #24344c; font-size:12px; }
    .ok { color:#6bff95; font-weight:1000; }
    .warn { color:#ffb020; font-weight:900; }
    .bad { color:#ff4d4d; font-weight:1000; }
    .hide { display:none !important; }
    .mono { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="tabs">
        <div id="tabRun" class="tab active">Run</div>
        <div id="tabHistory" class="tab">History</div>
      </div>
      <span id="status" class="pill">idle</span>
    </div>

    <div id="viewRun">
      <div class="card">
        <div class="row">
          <button id="btnArm">ARM</button>
          <button id="btnStop" class="danger" disabled>STOP</button>
          <button id="btnReset" class="secondary">RESET</button>
        </div>

        <div class="kpi" style="margin-top:12px;">
          <div class="box"><div class="label">Km/j</div><div id="speed" class="value mono">—</div></div>
          <div class="box"><div class="label">Jarak (m)</div><div id="distance" class="value mono">0.0</div></div>
          <div class="box"><div class="label">GPS Acc</div><div id="accuracy" class="value mono">—</div></div>
        </div>

        <div class="small" style="margin-top:10px;">
          Status: <span id="stateText" class="pill">idle</span>
          <span id="hint" class="small" style="margin-left:8px;"></span>
        </div>
      </div>

      <div class="card">
        <h1>Hasil Split</h1>
        <table>
          <thead><tr><th>Marker</th><th>Waktu</th><th>Speed</th></tr></thead>
          <tbody>
            <tr><td>60 ft</td><td id="t60">—</td><td id="n60">—</td></tr>
            <tr><td>201 m</td><td id="t201">—</td><td id="n201">—</td></tr>
            <tr><td>402 m</td><td id="t402">—</td><td id="n402">—</td></tr>
            <tr><td>MAX</td><td id="maxAt">—</td><td id="maxSpeed">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="viewHistory" class="hide">
      <div class="card"><h1>History</h1><button id="btnClearAll" class="danger">Hapus</button></div>
      <div id="historyList"></div>
    </div>
  </div>

<script>
(() => {
  // --- CONFIG ---
  const V_TRIGGER = 5;      // Mulai otomatis saat 5 km/j
  const MAX_ACC = 15;       // Akurasi GPS maksimal
  const STORAGE_KEY = "racebox_data_v3";

  const TARGETS = [
    { key: "60", m: 18.288 },
    { key: "201", m: 201 },
    { key: "402", m: 402 }
  ];

  // --- STATE ---
  let state = "idle", watchId = null, armFix = null, prevFix = null;
  let totalDist = 0, startPerf = null, hit = new Map(), maxV = 0, maxAt = 0;

  const el = (id) => document.getElementById(id);

  function updateUI(s) {
    state = s;
    el("stateText").textContent = s;
    el("status").textContent = s;
    el("btnArm").disabled = !["idle", "finished", "stopped"].includes(s);
    el("btnStop").disabled = (s === "idle");
  }

  function setHint(msg, cls="") {
    el("hint").textContent = msg;
    el("hint").className = "small " + cls;
  }

  function haversine(l1, o1, l2, o2) {
    const R = 6371000, r = (d) => d * Math.PI / 180;
    const dL = r(l2-l1), dO = r(o2-o1);
    const a = Math.sin(dL/2)**2 + Math.cos(r(l1)) * Math.cos(r(l2)) * Math.sin(dO/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function onPosition(pos) {
    const { latitude: lat, longitude: lon, accuracy: acc, speed } = pos.coords;
    const v = (speed || 0) * 3.6;
    const now = performance.now();

    el("accuracy").textContent = acc.toFixed(1);
    el("speed").textContent = v.toFixed(1);

    if (acc > MAX_ACC) return;

    // ARMED: Lock start point
    if (state === "armed" && !armFix) {
      armFix = { lat, lon, now };
      prevFix = armFix;
      setHint("READY! Begitu kecepatan ≥ 5 km/j, timer jalan.", "ok");
      return;
    }

    // TRIGGER CHECK (Kecepatan >= 5 km/j)
    if (state === "armed" && armFix) {
      if (v >= V_TRIGGER) {
        updateUI("running");
        startPerf = now;
        totalDist = 0;
        maxV = 0;
        hit.clear();
        prevFix = { lat, lon, now };
        setHint("GO GO GO!", "ok");
      }
      return;
    }

    // RUNNING
    if (state === "running") {
      const d = haversine(prevFix.lat, prevFix.lon, lat, lon);
      totalDist += d;
      el("distance").textContent = totalDist.toFixed(1);

      if (v > maxV) {
        maxV = v; maxAt = totalDist;
        el("maxSpeed").textContent = maxV.toFixed(1) + " km/j";
        el("maxAt").textContent = maxAt.toFixed(1) + " m";
      }

      TARGETS.forEach(t => {
        if (!hit.has(t.key) && totalDist >= t.m) {
          const time = (now - startPerf) / 1000;
          hit.set(t.key, time);
          el("t" + t.key).textContent = time.toFixed(3) + " s";
          el("n" + t.key).textContent = v.toFixed(1) + " km/j";
        }
      });

      if (totalDist >= 402.1) finish(true);
      prevFix = { lat, lon, now };
    }
  }

  function finish(ok) {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    updateUI(ok ? "finished" : "stopped");
    setHint(ok ? "Selesai!" : "Batal.", ok ? "ok" : "warn");
    if (ok) {
      const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      logs.unshift({ date: new Date().toLocaleString(), v: maxV.toFixed(1), d: totalDist.toFixed(1) });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs.slice(0, 20)));
    }
  }

  el("btnArm").onclick = () => {
    updateUI("armed");
    setHint("Mencari GPS...", "warn");
    armFix = null;
    watchId = navigator.geolocation.watchPosition(onPosition, (e) => setHint("Error: " + e.message, "bad"), { enableHighAccuracy: true });
  };

  el("btnStop").onclick = () => finish(false);
  el("btnReset").onclick = () => { finish(false); el("distance").textContent = "0.0"; updateUI("idle"); };
  
  el("tabHistory").onclick = () => {
    el("viewRun").classList.add("hide"); el("viewHistory").classList.remove("hide");
    el("tabHistory").classList.add("active"); el("tabRun").classList.remove("active");
    const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    el("historyList").innerHTML = logs.map(l => `<div class="card"><small>${l.date}</small><br><b>${l.v} km/j</b> - ${l.d}m</div>`).join("");
  };

  el("tabRun").onclick = () => {
    el("viewRun").classList.remove("hide"); el("viewHistory").classList.add("hide");
    el("tabRun").classList.add("active"); el("tabHistory").classList.remove("active");
  };

  el("btnClearAll").onclick = () => { localStorage.removeItem(STORAGE_KEY); el("historyList").innerHTML = ""; };

})();
</script>
</body>
</html>
